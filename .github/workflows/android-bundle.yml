# Builds the signed Kindlehaven Android App Bundle (.aab) for Google Play from the mobile-native branch.
# Run it from the Actions tab: "Android app bundle" -> Run workflow. Download the .aab from the run's Artifacts.
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KH_KEYSTORE_BASE64, KH_STORE_PASSWORD, KH_KEY_ALIAS, KH_KEY_PASSWORD
name: Android app bundle
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code: a whole number, one higher than the last upload to Play (first upload: 1)"
        required: true
        default: "1"
      branch:
        description: "Branch to build"
        required: true
        default: mobile-native
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install and bundle the game
        working-directory: mobile
        run: |
          npm ci
          node build-www.mjs
          npx cap sync android
      - name: Build signed bundle
        working-directory: mobile/android
        env:
          KH_KEYSTORE_BASE64: ${{ secrets.KH_KEYSTORE_BASE64 }}
          KH_STORE_PASSWORD: ${{ secrets.KH_STORE_PASSWORD }}
          KH_KEY_ALIAS: ${{ secrets.KH_KEY_ALIAS }}
          KH_KEY_PASSWORD: ${{ secrets.KH_KEY_PASSWORD }}
        run: |
          if [ -z "$KH_KEYSTORE_BASE64" ]; then echo "Missing KH_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KH_KEYSTORE="$RUNNER_TEMP/upload.jks"
          VERSION_NAME=$(grep -o "GAME_VERSION = '[0-9.]*'" ../../index.html | grep -o "[0-9.]*[0-9]")
          chmod +x gradlew
          ./gradlew bundleRelease -PappVersionCode=${{ inputs.version_code }} -PappVersionName="$VERSION_NAME"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: kindlehaven-aab-${{ inputs.version_code }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frosthold Play Report</title>
<style>
:root{--bg:#f4f3ef;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--bar:#2a78d6;--bar-hi:#1c5fb0;--good:#006300;--warn:#8a5a00;--bad:#b42318;--chip:#ecebe6;--accent:#2b4a74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--bar:#3987e5;--bar-hi:#6aa8f0;--good:#0ca30c;--warn:#e0a020;--bad:#f0645a;--chip:#262624;--accent:#9fc3ef}}
:root[data-theme="dark"]{--bg:#121211;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--bar:#3987e5;--bar-hi:#6aa8f0;--good:#0ca30c;--warn:#e0a020;--bad:#f0645a;--chip:#262624;--accent:#9fc3ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:2px 0 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl select,.ctl button,.ctl label{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:6px 10px}
.ctl button{cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:12px 14px}
.tile .k{color:var(--ink2);font-size:13px}.tile .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}.tile .n{color:var(--muted);font-size:12px}
section{background:var(--surface);border:1px solid var(--grid);border-radius:14px;padding:16px;margin:14px 0}
section h2{margin:0 0 4px;font-size:18px}section>p.d{margin:0 0 12px;color:var(--ink2);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chart h3{margin:0 0 8px;font-size:14px;color:var(--ink2);font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(80px,34%) 1fr auto;gap:8px;align-items:center;font-size:13px;position:relative;cursor:default}
.brow .lb{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tr{height:14px;border-left:1px solid var(--grid)}
.brow .b{height:14px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.brow:hover .b{background:var(--bar-hi)}.brow .val{font-variant-numeric:tabular-nums;color:var(--ink);min-width:3ch;text-align:right}
.empty{color:var(--muted);font-size:14px}
.sugg{display:flex;flex-direction:column;gap:10px}
.sg{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px;border-radius:10px;background:var(--chip)}
.sg .ic{font-weight:700;font-size:12px;padding:3px 8px;border-radius:999px;height:fit-content;white-space:nowrap;border:1px solid currentColor}
.sg.good .ic{color:var(--good)}.sg.warn .ic{color:var(--warn)}.sg.bad .ic{color:var(--bad)}.sg.info .ic{color:var(--accent)}
.sg b{display:block}.sg p{margin:3px 0 0;color:var(--ink2);font-size:14px}.sg .ev{color:var(--muted);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}th{color:var(--ink2);font-weight:600}
.tw{overflow-x:auto}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:9}
#ai{white-space:pre-wrap;font-size:14px;color:var(--ink);margin-top:10px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Frosthold play report</h1><p class="sub" id="sub">Loading play sessions…</p></div>
  <div class="ctl">
    <select id="range" aria-label="Time range"><option value="0">All time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
    <label><input type="checkbox" id="incl"> Include staging and test runs</label>
    <button type="button" id="back">Back to game</button>
  </div>
</header>
<div id="body"></div>
</main>
<div id="tip"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const med = a => { if (!a.length) return 0; const b = [...a].sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const sum = a => a.reduce((x, y) => x + y, 0);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const fmtMin = m => m >= 90 ? (m / 60).toFixed(1) + ' h' : Math.round(m) + ' min';
const NAMES = { spider: 'Spider', goblin: 'Goblin', wolf: 'Wolf', bear: 'Bear', troll: 'Troll', wraith: 'Wraith', golem: 'Golem', raptor: 'Raptor', tiger: 'Sabre tiger', mammoth: 'Mammoth', trex: 'T-rex', dragon: 'Dragon', yeti: 'Yeti', rabbit: 'Rabbit', deer: 'Deer', yak: 'Yak', boar: 'Boar', eagle: 'Eagle',
  weapon: 'Weapon', armor: 'Armour', axe: 'Axe', bag: 'Pack', boots: 'Boots', iron: 'Iron', steel: 'Steel', runesteel: 'Runesteel', log: 'Logs', stone: 'Stone', ore: 'Crystal', meat: 'Meat',
  hide1: 'Rough Hide', hide2: 'Thick Hide', hide3: 'Shaggy Pelt', hide4: 'Dragon Scale', sinew1: 'Sinew', sinew2: 'Strong Sinew', sinew3: 'Beast Sinew', sinew4: 'Ancient Sinew', frostgem: 'Frost Gem', emberruby: 'Ember Ruby', voidopal: 'Void Opal', spirit: 'Spirit Essence', moonsilver: 'Moonsilver', dragonheart: 'Dragon Heart' };
const nm = k => NAMES[k] || (k.startsWith('sp:') ? 'Special: ' + k.slice(3) : k);
let ALL = [], dbRef = null, sampleFn = null;

function bars(title, entries, unit, max = 12, ordered) {   // ordered: keep the given order (stages, ranges) and show zeros
  entries = ordered ? entries.slice(0, max) : entries.filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, max);
  if (!entries.some(e => e[1] > 0)) return `<div class="chart"><h3>${esc(title)}</h3><p class="empty">No data yet.</p></div>`;
  const top = Math.max(1e-9, ...entries.map(e => e[1]));
  return `<div class="chart"><h3>${esc(title)}</h3><div class="bars">` + entries.map(([k, v, tip]) =>
    `<div class="brow" data-tip="${esc(tip || (k + ': ' + v + (unit ? ' ' + unit : '')))}"><span class="lb">${esc(k)}</span><span class="tr"><span class="b" style="display:block;width:${Math.max(1, v / top * 100)}%"></span></span><span class="val">${typeof v === 'number' && v % 1 ? v.toFixed(1) : v}</span></div>`).join('') + '</div></div>';
}
const tile = (k, v, n) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div>${n ? `<div class="n">${esc(n)}</div>` : ''}</div>`;
const merge = (list, key) => { const o = {}; list.forEach(s => { const m = s[key] || {}; for (const k in m) o[k] = (o[k] || 0) + m[k]; }); return o; };

function analyse(S) {
  const sess = S.filter(s => (s.activeMin || 0) >= 0.5);
  const players = {}; sess.forEach(s => { (players[s.pid] = players[s.pid] || []).push(s); });
  const pids = Object.keys(players), mins = sess.map(s => s.activeMin || 0), totalMin = sum(mins);
  const best = pids.map(id => { const L = players[id]; const b = L.reduce((a, s) => ({ th: Math.max(a.th, s.th || 1), castle: Math.max(a.castle, s.castle || 0), lvl: Math.max(a.lvl, s.lvl || 1), victory: a.victory || !!s.victory, min: a.min + (s.activeMin || 0), day: Math.max(a.day, s.day || 1) }), { th: 1, castle: 0, lvl: 1, victory: false, min: 0, day: 1 }); b.n = L.length; return b; });
  const stage = b => b.victory ? 'Victory' : b.castle ? 'Castle ' + ['', 'I', 'II', 'III'][b.castle] : ['', 'Camp (TH I)', 'Town (TH II)', 'Citadel (TH III)'][b.th];
  const STAGES = ['Camp (TH I)', 'Town (TH II)', 'Citadel (TH III)', 'Castle I', 'Castle II', 'Castle III', 'Victory'];
  const stageCount = STAGES.map(st => [st, best.filter(b => stage(b) === st).length]);
  // milestones only count when the session started below them
  const msOf = (k, below) => { const v = sess.filter(s => s.ms && s.ms[k] && (!s.startState || below(s.startState))).map(s => s.ms[k].min); return v.length ? [med(v), v.length] : null; };
  const milestones = [['Town Hall II', msOf('th2', st => st.th < 2)], ['Town Hall III', msOf('th3', st => st.th < 3)], ['Castle I', msOf('castle1', st => !st.castle)], ['Hero level 5', msOf('lvl5', st => st.lvl < 5)], ['Hero level 10', msOf('lvl10', st => st.lvl < 10)], ['First craft', msOf('firstCraft', () => true)], ['First pet', msOf('pet', () => true)]];
  const knock = sum(sess.map(s => s.knock || 0)), raids = sum(sess.map(s => s.raidsEnded || 0)), clean = sum(sess.map(s => s.raidsClean || 0));
  const fell = sess.filter(s => s.fell), dW = sum(sess.map(s => (s.dungeons || {}).won || 0)), dL = sum(sess.map(s => (s.dungeons || {}).lost || 0));
  const kills = merge(sess, 'kills'), hunts = merge(sess, 'hunts'), crafts = merge(sess, 'crafts'), smelt = merge(sess, 'smelt'), mats = merge(sess, 'matsGot'), gather = merge(sess, 'gather');
  const tames = {}; sess.forEach(s => (s.tames || []).forEach(t => { tames[t] = (tames[t] || 0) + 1; }));
  const hours = totalMin / 60 || 1e-9;
  const lenBins = [['under 5 min', 0, 5], ['5–15 min', 5, 15], ['15–30 min', 15, 30], ['30–60 min', 30, 60], ['1–2 h', 60, 120], ['over 2 h', 120, 1e9]].map(([k, a, b]) => [k, mins.filter(m => m >= a && m < b).length]);
  const coop = sess.filter(s => s.mode !== 'solo'), solo = sess.filter(s => s.mode === 'solo');
  const rate = (L, f) => { const h = sum(L.map(s => s.activeMin || 0)) / 60; return h > 0.05 ? sum(L.map(f)) / h : null; };
  return { sess, players, pids, mins, totalMin, best, stageCount, milestones, knock, raids, clean, fell, dW, dL, kills, hunts, crafts, smelt, mats, gather, tames, hours, lenBins, coop, solo, rate,
    returning: pids.filter(id => players[id].length > 1).length, reachTH2: best.filter(b => b.th >= 2 || b.castle).length, reachTH3: best.filter(b => b.th >= 3 || b.castle).length, reachCastle: best.filter(b => b.castle).length, victories: best.filter(b => b.victory).length,
    engaged: best.filter(b => b.min >= 15) };
}

// rule-based suggestions: each looks at one balance signal and explains what to change
function suggest(A) {
  const out = [], add = (lvl, t, p, ev) => out.push({ lvl, t, p, ev });
  const n = A.sess.length;
  if (n < 5) add('info', 'Not much data yet', 'Suggestions get reliable after about 10 play sessions from a few different players. Share the game and check back.', n + ' sessions so far');
  const mL = med(A.mins);
  if (n >= 5 && mL < 8) add('bad', 'Players leave early', 'Half of all sessions end within ' + mL.toFixed(1) + ' minutes. Make the first five minutes more rewarding: a faster first wall, an earlier first raid win, or a quest reward in the opening tutorial steps.', 'Median session ' + mL.toFixed(1) + ' min');
  else if (n >= 5 && mL > 25) add('good', 'Sessions run long', 'People stay a good while each time they play (median ' + mL.toFixed(0) + ' min). Keep a steady drip of goals so long sessions don\'t stall.', 'Median session ' + mL.toFixed(0) + ' min');
  if (A.pids.length >= 4) { const r = pct(A.returning, A.pids.length);
    if (r < 30) add('warn', 'Few players come back', 'Only ' + r + '% of players have played more than once. Consider a reason to return: daily quests, a visible next goal on the start screen, or co-op invites.', A.returning + ' of ' + A.pids.length + ' players returned');
    else add('good', 'Players come back', r + '% of players have more than one session.', A.returning + ' of ' + A.pids.length + ' players'); }
  const eng = A.engaged.length;
  if (eng >= 3) { const r2 = pct(A.engaged.filter(b => b.th >= 2 || b.castle).length, eng);
    if (r2 < 50) add('bad', 'Town Hall II is a wall', 'Only ' + r2 + '% of players who played 15+ minutes reached Town Hall II. Lower the first palisade or Town Hall II cost, or have loggers start sooner.', r2 + '% of engaged players reached TH II');
    const r3 = pct(A.engaged.filter(b => b.th >= 3 || b.castle).length, eng), long = A.engaged.filter(b => b.min >= 60).length;
    if (long >= 3 && pct(A.engaged.filter(b => b.min >= 60 && (b.th >= 3 || b.castle)).length, long) < 40) add('warn', 'Mid game is slow', 'Players with an hour or more often still haven\'t reached Town Hall III. The second ring of walls and stone costs may be too steep; consider cheaper stone walls or more stonecutters.', r3 + '% of engaged players reached TH III'); }
  const ms2 = A.milestones[0][1]; if (ms2 && ms2[1] >= 3 && ms2[0] > 35) add('warn', 'Town Hall II takes a long time', 'The median player needs ' + ms2[0].toFixed(0) + ' minutes of play to reach Town Hall II. Aim for 15–25.', 'Median ' + ms2[0].toFixed(0) + ' min, ' + ms2[1] + ' sessions');
  if (n >= 5) { const fr = pct(A.fell.length, n);
    if (fr > 20) add('bad', 'Towns fall too often', fr + '% of sessions ended with the town falling. Raids or winter may be too harsh early: slow the raid size growth, or give more warmth and food per villager.', A.fell.length + ' of ' + n + ' sessions; median fall on day ' + med(A.fell.map(s => s.fell.day || 1)));
    else if (A.raids >= 8 && fr === 0 && pct(A.clean, A.raids) > 85) add('warn', 'Raids are too easy', pct(A.clean, A.raids) + '% of raids end with no wall broken and no town has fallen. Raise raid strength after day 3, or add mixed waves with ranged attackers.', A.clean + ' clean of ' + A.raids + ' raids');
    else if (A.raids >= 8) add('good', 'Raids feel fair', pct(A.clean, A.raids) + '% of raids end with every wall standing, and towns rarely fall.', A.raids + ' raids, ' + A.fell.length + ' towns fell'); }
  if (A.hours > 1) { const kph = A.knock / A.hours;
    if (kph > 4) add('bad', 'Heroes get knocked out a lot', kph.toFixed(1) + ' knockouts per hour of play. Wild camps or raiders may hit too hard for new heroes: lower early damage, or make armour easier to craft.', A.knock + ' knockouts in ' + A.hours.toFixed(1) + ' h');
    else if (kph < 0.3 && A.hours > 3) add('warn', 'Combat may be too safe', 'Heroes are almost never knocked out (' + kph.toFixed(2) + ' per hour). Consider tougher camps closer in.', A.knock + ' knockouts in ' + A.hours.toFixed(1) + ' h'); }
  const dT = A.dW + A.dL; if (dT >= 5) { const w = pct(A.dW, dT);
    if (w < 40) add('warn', 'Dungeons are hard', 'Only ' + w + '% of dungeon runs are cleared. Consider an extra heart, lower spike damage, or checkpoints.', A.dW + ' won, ' + A.dL + ' lost');
    else if (w > 90) add('info', 'Dungeons are easy', w + '% of runs are cleared. Harder star-4 layouts would keep them interesting.', A.dW + ' won, ' + A.dL + ' lost'); }
  const crafts = sum(Object.values(A.crafts)), hides = sum(Object.entries(A.mats).filter(([k]) => /hide|sinew/.test(k)).map(e => e[1]));
  if (A.hours > 1) { if (crafts / A.hours < 0.5 && hides / A.hours > 20) add('warn', 'Materials pile up but few items get crafted', 'Players collect materials (' + Math.round(hides / A.hours) + ' hides and sinew per hour) but craft only ' + (crafts / A.hours).toFixed(1) + ' items per hour. Recipes may cost too much gold or logs; try lowering the gold part.', crafts + ' crafts, ' + hides + ' hides and sinew');
    else if (hides / A.hours < 6 && A.hours > 2) add('warn', 'Hide and sinew drops feel scarce', 'Only ' + (hides / A.hours).toFixed(1) + ' hides and sinew per hour of play. Raise tier-1 drop chances so the first crafts come sooner.', hides + ' in ' + A.hours.toFixed(1) + ' h');
    const rare = sum(['frostgem', 'emberruby', 'voidopal', 'spirit', 'moonsilver', 'dragonheart'].map(k => A.mats[k] || 0));
    if (A.reachCastle >= 2 && rare < 3) add('info', 'Rare materials barely show up', 'Players reach the castle but have found only ' + rare + ' gems or magic materials in total. Rare and legendary gear may be out of reach.', rare + ' rare materials'); }
  if (A.engaged.length >= 3 && !sum(Object.values(A.tames))) add('info', 'Nobody has tamed a pet', 'The Beast Charm may be too hard to get. Consider granting it at hero level 6 instead of 10.', '0 tames');
  if (A.coop.length >= 3 && A.solo.length >= 3) { const kc = A.rate(A.coop, s => s.knock || 0), ks = A.rate(A.solo, s => s.knock || 0);
    if (kc != null && ks != null && kc > ks * 2 && kc > 2) add('warn', 'Co-op is rougher than solo', 'Co-op heroes are knocked out ' + kc.toFixed(1) + ' times an hour versus ' + ks.toFixed(1) + ' solo. Raids may scale too hard with player count.', A.coop.length + ' co-op, ' + A.solo.length + ' solo sessions'); }
  if (A.victories) add('good', 'Someone beat the game', A.victories + ' player' + (A.victories > 1 ? 's have' : ' has') + ' won all three dragon sieges.', '');
  const order = { bad: 0, warn: 1, info: 2, good: 3 }; return out.sort((a, b) => order[a.lvl] - order[b.lvl]);
}

function render() {
  const days = +$('range').value, incl = $('incl').checked, now = Date.now();
  const S = ALL.filter(s => (incl || (!s.staging && !s.cheated)) && (!days || now - (s.updated || 0) < days * 864e5));
  const hidden = ALL.length - ALL.filter(s => incl || (!s.staging && !s.cheated)).length;
  $('sub').textContent = ALL.length ? `${S.length} sessions shown` + (hidden && !incl ? ` · ${hidden} staging or test runs hidden` : '') + ' · updated ' + new Date().toLocaleTimeString() : 'No play sessions recorded yet.';
  if (!S.length) { $('body').innerHTML = `<section><h2>No sessions yet</h2><p class="d">Sessions are recorded while people play this game on claude.ai (signed in, with Contributor access or above). Each session saves once a minute and when the player leaves.${ALL.length && !incl ? ' Tick “Include staging and test runs” to see your own test sessions.' : ''}</p></section>`; return; }
  const A = analyse(S), sg = suggest(A);
  let h = '<div class="tiles">' + tile('Sessions', A.sess.length) + tile('Players', A.pids.length, A.returning + ' came back') + tile('Time played', fmtMin(A.totalMin)) + tile('Median session', fmtMin(med(A.mins)), 'mean ' + fmtMin(A.totalMin / Math.max(1, A.sess.length)))
    + tile('Towns fallen', A.fell.length, pct(A.fell.length, A.sess.length) + '% of sessions') + tile('Raids repelled', A.raids, pct(A.clean, A.raids) + '% with no wall broken') + tile('Knockouts / hour', (A.knock / A.hours).toFixed(1), A.knock + ' in total') + tile('Dungeons cleared', A.dW + ' / ' + (A.dW + A.dL), pct(A.dW, A.dW + A.dL) + '% win rate') + '</div>';
  h += `<section><h2>Suggestions</h2><p class="d">Worked out from the numbers below. Most serious first.</p><div class="sugg">` + sg.map(x => `<div class="sg ${x.lvl}"><span class="ic">${{ bad: '▲ Fix', warn: '● Tune', info: 'ℹ Idea', good: '✓ Good' }[x.lvl]}</span><div><b>${esc(x.t)}</b><p>${esc(x.p)}</p>${x.ev ? `<div class="ev">${esc(x.ev)}</div>` : ''}</div></div>`).join('') + `</div>
    <div style="margin-top:12px" id="aiWrap"></div></section>`;
  h += `<section><h2>Progress</h2><p class="d">How far each player has got (their best across sessions), and how long it takes to reach each milestone.</p><div class="grid2">`
    + bars('Furthest stage reached, by player', A.stageCount.map(([k, v]) => [k, v, k + ': ' + v + ' player' + (v === 1 ? '' : 's')]), 'players', 9, true)
    + bars('Median minutes of play to reach', A.milestones.filter(m => m[1]).map(([k, m]) => [k, Math.round(m[0] * 10) / 10, k + ': median ' + m[0].toFixed(1) + ' min across ' + m[1] + ' sessions']), 'min', 12, true) + '</div></section>';
  h += `<section><h2>Sessions</h2><p class="d">How long people play each time.</p><div class="grid2">` + bars('Session length', A.lenBins.map(([k, v]) => [k, v, k + ': ' + v + ' sessions']), 'sessions', 12, true)
    + bars('Highest hero level per player', ['1–4', '5–9', '10–19', '20+'].map(k => { const v = A.best.filter(b => (k === '20+' ? b.lvl >= 20 : k === '10–19' ? b.lvl >= 10 && b.lvl < 20 : k === '5–9' ? b.lvl >= 5 && b.lvl < 10 : b.lvl < 5)).length; return ['Level ' + k, v, 'Level ' + k + ': ' + v + ' players']; }), 'players', 12, true) + '</div></section>';
  h += `<section><h2>Combat and creatures</h2><div class="grid2">` + bars('Monsters slain (by players)', Object.entries(A.kills).map(([k, v]) => [nm(k), v])) + bars('Animals hunted', Object.entries(A.hunts).map(([k, v]) => [nm(k), v]))
    + bars('Pets tamed', Object.entries(A.tames).map(([k, v]) => [nm(k), v])) + bars('Knockouts per hour: solo vs co-op', [['Solo', +(A.rate(A.solo, s => s.knock || 0) || 0).toFixed(1)], ['Co-op', +(A.rate(A.coop, s => s.knock || 0) || 0).toFixed(1)]], 'per hour', 12, true) + '</div></section>';
  h += `<section><h2>Crafting and materials</h2><div class="grid2">` + bars('Items forged', Object.entries(A.crafts).map(([k, v]) => [nm(k), v])) + bars('Materials collected', Object.entries(A.mats).map(([k, v]) => [nm(k), v]), '', 14)
    + bars('Metal smelted', Object.entries(A.smelt).map(([k, v]) => [nm(k), v])) + bars('Resources gathered', Object.entries(A.gather).map(([k, v]) => [nm(k), v])) + '</div></section>';
  const recent = [...A.sess].sort((a, b) => (b.updated || 0) - (a.updated || 0)).slice(0, 40);
  h += `<section><h2>Recent sessions</h2><div class="tw"><table><thead><tr><th>When</th><th>Player</th><th>Mode</th><th>Played</th><th>Day</th><th>Town</th><th>Level</th><th>Raids</th><th>KOs</th><th>Result</th></tr></thead><tbody>`
    + recent.map(s => `<tr><td>${new Date(s.updated || s.started).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td><td>${esc(s.name || 'Player ' + String(s.pid).slice(0, 4))}</td><td>${s.mode === 'solo' ? 'Solo' : 'Co-op ' + (s.players || '')}</td><td>${fmtMin(s.activeMin || 0)}</td><td>${s.day}</td><td>${s.castle ? 'Castle ' + ['', 'I', 'II', 'III'][s.castle] : 'TH ' + ['', 'I', 'II', 'III'][s.th || 1]}</td><td>${s.lvl}</td><td>${s.raidsEnded || 0}</td><td>${s.knock || 0}</td><td>${s.victory ? 'Victory' : s.fell ? 'Town fell (day ' + s.fell.day + ')' : s.cheated ? 'Test' : '—'}</td></tr>`).join('') + '</tbody></table></div></section>';
  $('body').innerHTML = h;
  if (sampleFn) { $('aiWrap').innerHTML = '<button type="button" id="askAi" class="ctlb" style="font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--grid);background:var(--chip);color:var(--ink);cursor:pointer">Ask Claude for more balance ideas</button><div id="ai"></div>';
    $('askAi').onclick = () => askAi(A, sg); }
}

async function askAi(A, sg) {
  const btn = $('askAi'); btn.disabled = true; $('ai').textContent = 'Thinking…';
  const summary = { sessions: A.sess.length, players: A.pids.length, returning: A.returning, hoursPlayed: +A.hours.toFixed(1), medianSessionMin: +med(A.mins).toFixed(1), furthestStage: Object.fromEntries(A.stageCount), milestonesMedianMin: Object.fromEntries(A.milestones.filter(m => m[1]).map(([k, m]) => [k, +m[0].toFixed(1)])),
    townsFell: A.fell.length, raids: A.raids, cleanRaids: A.clean, knockoutsPerHour: +(A.knock / A.hours).toFixed(2), dungeonsWon: A.dW, dungeonsLost: A.dL, kills: A.kills, hunts: A.hunts, tames: A.tames, crafts: A.crafts, materials: A.mats, smelt: A.smelt, ruleFindings: sg.map(x => x.t) };
  const prompt = 'You are a game balance designer. Frosthold is a survival town-builder: chop wood, keep villagers warm and fed, build walls, survive nightly raids, upgrade the Town Hall (I-III) then a Castle (I-III), win three dragon sieges. Heroes level up, explore wild camps and dungeons, hunt for hides, sinew, metal, gems and magic materials, and craft gear at a forge. Players can tame pets and play co-op.\n\nHere is aggregated play data as JSON:\n' + JSON.stringify(summary) + '\n\nGive 5 to 8 specific, practical suggestions to improve balance, difficulty curve and player retention. For each: one short title line, then one or two sentences with the change and the number it is based on. Plain text, no markdown headings.';
  try { const r = await sampleFn(prompt, { onText: ({ text }) => { $('ai').textContent = text; } }); $('ai').textContent = r.text; }
  catch (e) { $('ai').textContent = e && e.code === 'not_granted' ? 'Claude was not allowed for this page.' : 'Could not get suggestions right now. Try again in a moment.'; }
  btn.disabled = false;
}

$('range').onchange = render; $('incl').onchange = render;
$('back').onclick = () => { if (history.length > 1) history.back(); else location.href = './'; };
document.addEventListener('mouseover', e => { const r = e.target.closest('[data-tip]'), t = $('tip'); if (!r) { t.style.opacity = 0; return; } t.textContent = r.dataset.tip; t.style.opacity = 1; });
document.addEventListener('mousemove', e => { const t = $('tip'); t.style.left = Math.min(innerWidth - t.offsetWidth - 8, e.clientX + 12) + 'px'; t.style.top = (e.clientY + 14) + 'px'; });
(async () => {
  const fail = msg => { $('sub').textContent = msg; $('body').innerHTML = `<section><p class="d">${esc(msg)}</p></section>`; };
  if (!window.claude || !window.claude.use) return fail('Open this report from the game on claude.ai to see play data.');
  const timer = setTimeout(() => fail('The play database did not answer. Reload to try again.'), 10000);
  try { dbRef = await window.claude.use('db'); } catch (e) { dbRef = null; }
  if (!dbRef) { clearTimeout(timer); return fail('Play data is not available in this view. Sign in to claude.ai and open the report from the game.'); }
  try { sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
  dbRef.collection('plays').orderBy('updated', 'desc').limit(1000).onSnapshot(snap => { clearTimeout(timer); ALL = snap.docs.map(d => d.data()).filter(Boolean); render(); }, err => { clearTimeout(timer); fail('Could not load play data (' + (err && err.code) + ').'); });
})();
</script>
</body>
</html>
